<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>京东推广工作台</title><link rel="stylesheet" href="/style.css"></head><body><aside><div class="brand"><b>J</b><div>电商工作台<small>京东 · 本地报表分析</small></div></div><p class="eyebrow">推广分析</p><nav id="nav"></nav><div class="aside-note">真实官方报表<br>数据保存在本机</div></aside><main><header><div><p class="eyebrow">JINGDONG / WORKBENCH</p><h1 id="title">整体概览</h1><p id="account"></p></div><div class="toolbar"><button id="demoToggle">体验演示数据</button><button id="refresh">刷新本地数据</button></div></header><section class="filters"><label>报表周期<select id="period"></select></label><label>快捷日期<select id="quick" title="按北京时间计算；最近7/15/30天包含今天。本地缺少数据时提示先采集。"><option value="custom">自定义日期</option><option value="today">今天</option><option value="yesterday">昨天</option><option value="week">本周</option><option value="7">最近7天</option><option value="15">最近15天</option><option value="30">最近30天</option><option value="month">本月</option><option value="lastmonth">上月</option><option value="all">当前报表完整周期</option></select></label><label>开始日期<input id="start" type="date"></label><label>结束日期<input id="end" type="date"></label><button id="reset">完整周期</button></section><p id="scope" class="scope"></p><div id="content" aria-live="polite">正在读取已校验报表…</div></main><dialog id="detail"><button id="closeDetail">关闭</button><h2>原始记录</h2><div id="detailBody"></div></dialog><script src="/manual-import.js"></script><script src="/jd-plan.js"></script><script src="/app.js"></script></body></html>
